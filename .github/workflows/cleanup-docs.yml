name: cleanup-docs

on:
  push:
    branches:
      - add-code-and-data

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: add-code-and-data
          fetch-depth: 0

      - name: Tighten remaining provenance wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("code/generate_uam_synthetic_data_bimtra_based.py")
          text = path.read_text(encoding="utf-8")
          old = "3. Applies both distributions deterministically (no randomness added)"
          new = "3. Samples daily totals and 15-minute slots from those empirical distributions with a fixed NumPy seed"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          path = Path("code/preprocessing/README.md")
          text = path.read_text(encoding="utf-8")
          if "## Provenance boundary" not in text:
              text = text.rstrip() + """

          ## Provenance boundary

          The retained preprocessing scripts reference raw Flightradar24 workspaces because those were used historically to derive aggregate quantities. No raw or flight-level Flightradar24 track file is included in this repository. The public experiment package distributes the archived processed inputs instead.

          `../data/data.csv` is the authoritative archived input for rerunning the Python experiment. The current `R/generate_sbgr_data.R` script excludes operational days 2023-04-24 through 2023-04-28, whereas the archived CSV contains those days. The available repository history does not establish when or why that exclusion was introduced, so this folder is documented as reference-only rather than an exact raw-to-processed reconstruction recipe.
          """
              path.write_text(text + "\n", encoding="utf-8")

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          if '"codeRepository":"https://github.com/Orbolato/Strategic-DCB-RL"' not in text:
              marker = '"url":"https://orbolato.github.io/Strategic-DCB-RL/","encoding"'
              replacement = '"url":"https://orbolato.github.io/Strategic-DCB-RL/","codeRepository":"https://github.com/Orbolato/Strategic-DCB-RL","encoding"'
              if marker not in text:
                  raise RuntimeError("ScholarlyArticle JSON-LD marker not found")
              path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY

      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'fixed NumPy seed' code/generate_uam_synthetic_data_bimtra_based.py
          grep -q '## Provenance boundary' code/preprocessing/README.md
          grep -q 'codeRepository.*Strategic-DCB-RL' index.html
          if ! git diff --quiet; then
            git config user.name "Lucas Orbolato Carvalho"
            git config user.email "40774995+Orbolato@users.noreply.github.com"
            git add code/generate_uam_synthetic_data_bimtra_based.py code/preprocessing/README.md index.html
            git commit -m "Clarify provenance and structured metadata"
            git push origin HEAD:add-code-and-data
          fi
